[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsq-rco-mlx"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.24", "tqdm>=4.60", "huggingface_hub>=0.23", "mlx>=0.20", "mlx-lm>=0.20", "pyarrow>=14", "tokenizers>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gsq-rco = "gsq_rco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: loads the real Qwen2.5-0.5B checkpoint or a full model pass (minutes, GBs of memory)"]
